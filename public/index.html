<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --tg-blue: #3390ec; --tg-bg: #ffffff; --tg-sidebar: #f4f4f5;
            --tg-border: #e4e4e4; --tg-text: #000000; --tg-text-secondary: #707579;
            --tg-msg-out: #eeffde; --tg-msg-in: #ffffff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #dfe1e5; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* Экран входа */
        #auth-screen { position: fixed; inset: 0; background: #fff; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-box { width: 380px; padding: 40px; text-align: center; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); background: #fff; }
        .auth-box h1 { color: var(--tg-blue); font-size: 32px; margin-bottom: 8px; }
        .auth-box p { color: var(--tg-text-secondary); font-size: 14px; margin-bottom: 24px; }
        .auth-box input { width: 100%; padding: 14px 16px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; outline: none; }
        .auth-box input:focus { border-color: var(--tg-blue); }
        .auth-box button { width: 100%; padding: 14px; background: var(--tg-blue); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .auth-box button:hover { background: #2b7cd3; }
        .auth-toggle { margin-top: 16px; font-size: 14px; color: var(--tg-blue); cursor: pointer; }
        .auth-error { color: #e53935; font-size: 13px; margin-bottom: 8px; min-height: 18px; }

        /* Основной интерфейс */
        #app { display: none; width: 100%; height: 100%; max-width: 1400px; background: var(--tg-bg); box-shadow: 0 1px 10px rgba(0,0,0,0.1); }
        #app.active { display: flex; }

        /* Сайдбар */
        .sidebar { width: 340px; background: var(--tg-sidebar); border-right: 1px solid var(--tg-border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { font-size: 20px; color: var(--tg-text); }
        .logout-btn { background: none; border: none; color: var(--tg-text-secondary); cursor: pointer; font-size: 14px; }
        .search-box { padding: 0 16px 12px; }
        .search-box input { width: 100%; padding: 10px 14px; border: none; border-radius: 20px; background: #e9e9eb; font-size: 14px; outline: none; }
        .chat-list { flex: 1; overflow-y: auto; }

        .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.15s; position: relative; }
        .chat-item:hover { background: #e9e9eb; }
        .chat-item.active { background: var(--tg-blue); color: #fff; }
        .chat-item.active .chat-preview, .chat-item.active .chat-time { color: rgba(255,255,255,0.8); }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #ff8a65, #ff5252); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 18px; flex-shrink: 0; }
        .avatar.online::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #4caf50; border: 2px solid var(--tg-sidebar); border-radius: 50%; }
        .chat-item.active .avatar { background: #fff; color: var(--tg-blue); }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-size: 15px; font-weight: 500; }
        .chat-preview { font-size: 13px; color: var(--tg-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .chat-time { font-size: 12px; color: var(--tg-text-secondary); }
        .unread-badge { background: var(--tg-blue); color: #fff; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: 600; margin-left: auto; }
        .chat-item.active .unread-badge { background: #fff; color: var(--tg-blue); }

        /* Область чата */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #e6ebee; position: relative; }
        .chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--tg-text-secondary); gap: 8px; }
        .chat-header { padding: 10px 20px; background: var(--tg-bg); border-bottom: 1px solid var(--tg-border); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .chat-header h3 { font-size: 16px; }
        .header-info { display: flex; flex-direction: column; }
        .header-status { font-size: 12px; color: var(--tg-text-secondary); }
        .call-btn { background: var(--tg-blue); color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 500; cursor: pointer; }
        .call-btn:hover { background: #2b7cd3; }

        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px; }
        .msg-bubble { max-width: 60%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.08); word-wrap: break-word; }
        .msg-bubble.self { align-self: flex-end; background: var(--tg-msg-out); border-bottom-right-radius: 4px; }
        .msg-bubble.other { align-self: flex-start; background: var(--tg-msg-in); border-bottom-left-radius: 4px; }
        .msg-bubble .meta { font-size: 10px; color: #9e9e9e; text-align: right; margin-top: 2px; }
        .msg-bubble.self .meta { color: #6e9e57; }

        .typing-indicator { padding: 0 20px 8px; font-size: 12px; color: var(--tg-blue); height: 20px; font-style: italic; }

        .input-area { padding: 12px 20px; background: var(--tg-bg); border-top: 1px solid var(--tg-border); display: flex; gap: 12px; align-items: center; }
        .input-area input { flex: 1; padding: 12px 16px; border: none; border-radius: 20px; background: #f4f4f5; font-size: 14px; outline: none; }
        .input-area button { background: var(--tg-blue); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        .input-area button:hover { background: #2b7cd3; }

        /* Модалка звонка */
        #call-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 20px; z-index: 200; }
        #call-modal.active { display: flex; }
        .call-videos { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .video-box { width: 320px; height: 240px; background: #111; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #333; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-box .label { position: absolute; bottom: 8px; left: 8px; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        .call-controls { display: flex; gap: 12px; }
        .btn-accept { background: #4caf50; color: #fff; border: none; padding: 12px 32px; border-radius: 24px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .btn-decline { background: #e53935; color: #fff; border: none; padding: 12px 32px; border-radius: 24px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .call-status { color: #fff; font-size: 14px; opacity: 0.8; }

        @media (max-width: 700px) {
            .sidebar { width: 100%; position: absolute; z-index: 50; height: 100%; }
            .sidebar.hidden { display: none; }
            .video-box { width: 280px; height: 210px; }
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h1 id="auth-title">Вход</h1>
        <p id="auth-subtitle">Введите имя и пароль</p>
        <div class="auth-error" id="auth-error"></div>
        <input type="text" id="username" placeholder="Имя пользователя" autocomplete="off">
        <input type="password" id="password" placeholder="Пароль" autocomplete="off">
        <button id="auth-submit-btn">Войти</button>
        <div class="auth-toggle" id="auth-toggle">Нет аккаунта? Зарегистрироваться</div>
    </div>
</div>

<div id="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Telegram</h2>
            <button class="logout-btn" id="logout-btn">Выйти</button>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Поиск...">
        </div>
        <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-area" id="chat-area">
        <div class="chat-placeholder" id="chat-placeholder">
            <h3>Выберите чат</h3>
            <p>Отправляйте сообщения и звоните</p>
        </div>
        
        <div id="active-chat" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <div class="header-info">
                    <h3 id="chat-with-name"></h3>
                    <span class="header-status" id="chat-with-status"></span>
                </div>
                <button class="call-btn" id="call-btn">📞 Позвонить</button>
            </div>
            <div class="messages-container" id="messages"></div>
            <div class="typing-indicator" id="typing-indicator"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Написать сообщение...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно звонка -->
<div id="call-modal">
    <div class="call-videos">
        <div class="video-box">
            <video id="local-video" autoplay muted playsinline></video>
            <div class="label">Вы</div>
        </div>
        <div class="video-box" id="remote-video-box" style="display: none;">
            <video id="remote-video" autoplay playsinline></video>
            <div class="label" id="remote-label">Собеседник</div>
        </div>
    </div>
    <div class="call-status" id="call-status">Соединение...</div>
    <div class="call-controls" id="call-controls">
        <button class="btn-decline" id="decline-btn">Отклонить</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // === DOM ===
    const authScreen = document.getElementById('auth-screen');
    const app = document.getElementById('app');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const authToggle = document.getElementById('auth-toggle');
    const authTitle = document.getElementById('auth-title');
    const authError = document.getElementById('auth-error');
    const chatListEl = document.getElementById('chat-list');
    const chatPlaceholder = document.getElementById('chat-placeholder');
    const activeChat = document.getElementById('active-chat');
    const chatWithName = document.getElementById('chat-with-name');
    const chatWithStatus = document.getElementById('chat-with-status');
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const callBtn = document.getElementById('call-btn');
    const searchInput = document.getElementById('search');
    const typingIndicator = document.getElementById('typing-indicator');
    
    const callModal = document.getElementById('call-modal');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteVideoBox = document.getElementById('remote-video-box');
    const remoteLabel = document.getElementById('remote-label');
    const callStatus = document.getElementById('call-status');
    const callControls = document.getElementById('call-controls');
    const declineBtn = document.getElementById('decline-btn');

    // === СОСТОЯНИЕ ===
    let isLogin = true;
    let socket = null;
    let myToken = localStorage.getItem('token');
    let myId = null;
    let myName = null;
    let usersCache = [];
    let onlineUserIds = [];
    let selectedUserId = null;
    let selectedUserName = null;
    let peerConnection = null;
    let localStream = null;
    let chatHistories = {};
    let activeCallTarget = null;
    let incomingOffer = null;
    let isCaller = false;
    let typingTimeout = null;

    // === АВТОРИЗАЦИЯ ===
    if (myToken) {
        // Если токен есть, пробуем войти
        socket = io({ auth: { token: myToken } });
        setupSocket();
    }

    authToggle.addEventListener('click', () => {
        isLogin = !isLogin;
        authTitle.textContent = isLogin ? 'Вход' : 'Регистрация';
        authSubmitBtn.textContent = isLogin ? 'Войти' : 'Создать аккаунт';
        authToggle.textContent = isLogin ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        authError.textContent = '';
    });

    authSubmitBtn.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) { authError.textContent = 'Заполните все поля'; return; }

        const endpoint = isLogin ? '/api/login' : '/api/register';
        try {
            const res = await fetch(endpoint, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error);
            
            localStorage.setItem('token', data.token);
            myToken = data.token;
            socket = io({ auth: { token: myToken } });
            setupSocket();
        } catch (e) {
            authError.textContent = e.message;
        }
    });

    // === SOCKET ЛОГИКА ===
    function setupSocket() {
        socket.on('connect', () => {
            authScreen.style.display = 'none';
            app.classList.add('active');
        });

        socket.on('connect_error', (err) => {
            if (err.message === 'Неверный токен') {
                localStorage.removeItem('token');
                location.reload();
            }
        });

        socket.on('user-list', (users) => {
            usersCache = users;
            renderChatList();
        });

        socket.on('online-status', (ids) => {
            onlineUserIds = ids;
            renderChatList();
            if (selectedUserId) {
                chatWithStatus.textContent = onlineUserIds.includes(selectedUserId) ? 'онлайн' : 'был(а) недавно';
            }
        });

        socket.on('history', ({ withUserId, messages }) => {
            chatHistories[withUserId] = messages;
            if (selectedUserId === withUserId) renderMessages(messages);
        });

        socket.on('new-message', (msg) => {
            if (!chatHistories[msg.sender_id]) chatHistories[msg.sender_id] = [];
            chatHistories[msg.sender_id].push(msg);
            if (selectedUserId === msg.sender_id) {
                renderMessages(chatHistories[msg.sender_id]);
                // Отправляем "прочитано" обратно (можно реализовать)
            } else {
                // Звук уведомления можно добавить сюда
            }
            renderChatList();
        });

        socket.on('message-sent', (msg) => {
            if (!chatHistories[msg.receiver_id]) chatHistories[msg.receiver_id] = [];
            if (!chatHistories[msg.receiver_id].find(m => m.id === msg.id)) {
                chatHistories[msg.receiver_id].push(msg);
            }
            if (selectedUserId === msg.receiver_id) renderMessages(chatHistories[msg.receiver_id]);
            renderChatList();
        });

        socket.on('typing', ({ from, isTyping }) => {
            if (selectedUserId === from) {
                typingIndicator.textContent = isTyping ? 'печатает...' : '';
            }
        });

        // === ВХОДЯЩИЙ ЗВОНОК ===
        socket.on('incoming-call', ({ from, fromName, offer }) => {
            if (peerConnection) {
                socket.emit('end-call', { to: from });
                return;
            }
            activeCallTarget = from;
            incomingOffer = offer;
            isCaller = false;
            
            // Настраиваем интерфейс для входящего
            remoteLabel.textContent = fromName;
            remoteVideoBox.style.display = 'none';
            callStatus.textContent = 'Входящий звонок...';
            callControls.innerHTML = `
                <button class="btn-accept" id="accept-btn">Принять</button>
                <button class="btn-decline" id="decline-call-btn">Отклонить</button>
            `;
            callModal.classList.add('active');
            
            document.getElementById('accept-btn').onclick = acceptCall;
            document.getElementById('decline-call-btn').onclick = () => {
                socket.emit('end-call', { to: activeCallTarget });
                closeCallUI();
            };

            // Воспроизводим звук (опционально)
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = 800; gain.gain.value = 0.1;
                osc.start();
                setTimeout(() => { osc.stop(); audioCtx.close(); }, 1000);
            } catch(e) {}
        });

        socket.on('call-answered', async ({ answer }) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            callStatus.textContent = 'Соединено';
            remoteVideoBox.style.display = 'block';
            callControls.innerHTML = `<button class="btn-decline" id="hangup-btn">Завершить</button>`;
            document.getElementById('hangup-btn').onclick = hangupCall;
        });

        socket.on('ice-candidate', async ({ candidate }) => {
            if (peerConnection) {
                try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e) {}
            }
        });

        socket.on('call-ended', () => {
            closeCallUI();
        });
    }

    // === ПРИНЯТЬ ЗВОНОК ===
    async function acceptCall() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            
            peerConnection.ontrack = (e) => {
                remoteVideo.srcObject = e.streams[0];
                remoteVideoBox.style.display = 'block';
            };
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) socket.emit('ice-candidate', { to: activeCallTarget, candidate: e.candidate });
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('call-answer', { to: activeCallTarget, answer });
            
            callStatus.textContent = 'Соединение...';
            callControls.innerHTML = `<button class="btn-decline" id="hangup-btn">Завершить</button>`;
            document.getElementById('hangup-btn').onclick = hangupCall;
        } catch (err) {
            alert('Ошибка доступа к камере: ' + err.message);
            socket.emit('end-call', { to: activeCallTarget });
            closeCallUI();
        }
    }

    // === ИСХОДЯЩИЙ ЗВОНОК ===
    callBtn.addEventListener('click', async () => {
        if (!selectedUserId) return;
        activeCallTarget = selectedUserId;
        isCaller = true;
        remoteLabel.textContent = selectedUserName;

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            remoteVideoBox.style.display = 'none';
            callStatus.textContent = 'Вызов...';
            callControls.innerHTML = `<button class="btn-decline" id="cancel-btn">Отменить</button>`;
            callModal.classList.add('active');

            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.ontrack = (e) => {
                remoteVideo.srcObject = e.streams[0];
                remoteVideoBox.style.display = 'block';
            };
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) socket.emit('ice-candidate', { to: activeCallTarget, candidate: e.candidate });
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call-request', { to: activeCallTarget, offer });

            document.getElementById('cancel-btn').onclick = () => {
                socket.emit('end-call', { to: activeCallTarget });
                closeCallUI();
            };
        } catch (err) {
            alert('Нет доступа к камере/микрофону');
        }
    });

    function hangupCall() {
        if (activeCallTarget) socket.emit('end-call', { to: activeCallTarget });
        closeCallUI();
    }

    function closeCallUI() {
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        localVideo.srcObject = null; remoteVideo.srcObject = null;
        callModal.classList.remove('active');
        activeCallTarget = null;
        incomingOffer = null;
    }

    // === РЕНДЕР ЧАТОВ ===
    function renderChatList() {
        const query = searchInput.value.toLowerCase();
        const filtered = usersCache.filter(u => u.username.toLowerCase().includes(query));
        
        chatListEl.innerHTML = filtered.map(u => {
            const isOnline = onlineUserIds.includes(u.id);
            const history = chatHistories[u.id] || [];
            const lastMsg = history.length > 0 ? history[history.length - 1] : null;
            let preview = 'Нет сообщений';
            let time = '';
            if (lastMsg) {
                preview = lastMsg.text.length > 25 ? lastMsg.text.substring(0, 25) + '...' : lastMsg.text;
                const d = new Date(lastMsg.timestamp);
                time = d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
            }
            
            return `
                <div class="chat-item ${selectedUserId === u.id ? 'active' : ''}" data-id="${u.id}" data-name="${u.username}">
                    <div class="avatar ${isOnline ? 'online' : ''}">${u.username.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">${u.username}</div>
                        <div class="chat-preview">${preview}</div>
                    </div>
                    <div class="chat-time">${time}</div>
                </div>
            `;
        }).join('');

        chatListEl.querySelectorAll('.chat-item').forEach(el => {
            el.addEventListener('click', () => {
                selectedUserId = parseInt(el.dataset.id);
                selectedUserName = el.dataset.name;
                chatPlaceholder.style.display = 'none';
                activeChat.style.display = 'flex';
                chatWithName.textContent = selectedUserName;
                chatWithStatus.textContent = onlineUserIds.includes(selectedUserId) ? 'онлайн' : 'был(а) недавно';
                chatListEl.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
                socket.emit('get-history', { withUserId: selectedUserId });
            });
        });
    }

    // === РЕНДЕР СООБЩЕНИЙ ===
    function renderMessages(messages) {
        messagesEl.innerHTML = messages.map(m => {
            const isSelf = m.sender_id !== selectedUserId;
            const time = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `
                <div class="msg-bubble ${isSelf ? 'self' : 'other'}">
                    ${escapeHtml(m.text)}
                    <div class="meta">${time}</div>
                </div>
            `;
        }).join('');
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // === ВВОД И ОТПРАВКА ===
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !selectedUserId) return;
        socket.emit('send-message', { to: selectedUserId, text });
        messageInput.value = '';
        socket.emit('typing', { to: selectedUserId, isTyping: false });
    }

    // Статус "печатает..."
    messageInput.addEventListener('input', () => {
        if (!selectedUserId) return;
        socket.emit('typing', { to: selectedUserId, isTyping: true });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('typing', { to: selectedUserId, isTyping: false });
        }, 1500);
    });

    // === ВЫХОД ===
    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('token');
        if (socket) socket.disconnect();
        location.reload();
    });

    // Закрытие по клику вне окна (для удобства)
    window.addEventListener('click', (e) => {
        if (e.target === callModal && !peerConnection) {
            callModal.classList.remove('active');
        }
    });
</script>
</body>
</html>
